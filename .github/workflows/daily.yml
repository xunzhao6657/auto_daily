name: daily-report

on:
  schedule:
    - cron: "15 23 * * 1-5"   # 北京时间 07:15 盘前报告
    - cron: "5 8 * * 1-5"      # 北京时间 16:05 收盘总结
  workflow_dispatch:
    inputs:
      type:
        description: "报告类型"
        type: choice
        default: am
        options: [am, pm]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests markdown

      - name: Determine report type
        id: type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ inputs.type }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "15 23 * * 1-5" ]; then
            echo "type=am" >> "$GITHUB_OUTPUT"
          else
            echo "type=pm" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate report
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TZ: Asia/Shanghai
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::warning::未配置 DEEPSEEK_API_KEY，将以 dry-run 模式生成数据底稿"
            python scripts/generate_report.py --type ${{ steps.type.outputs.type }} --dry-run
          else
            python scripts/generate_report.py --type ${{ steps.type.outputs.type }}
          fi

      - name: Commit reports
        run: |
          git config user.name "report-bot"
          git config user.email "actions@github.com"
          git add reports index.html
          if git diff --cached --quiet; then
            echo "无新报告，跳过提交"
          else
            git commit -m "report: $(TZ=Asia/Shanghai date +%F) ${{ steps.type.outputs.type }}"
            git push
          fi

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
